name: CI

on:
  pull_request:
  push:
    branches:
      - 'release/**'
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jackson-version:
          - 2.13.3
          - 2.19.4
          - 2.21.4
    name: build (Jackson ${{ matrix.jackson-version }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build and run unit tests
        run: mvn -B -DskipITs -Djackson.version=${{ matrix.jackson-version }} verify
